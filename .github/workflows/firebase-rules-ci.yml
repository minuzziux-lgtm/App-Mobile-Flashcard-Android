name: MyDeck - regras Firestore (emulador)

on:
  push:
    branches:
      - dev/mydeck-private
    paths:
      - 'firestore.rules'
      - 'firebase.json'
      - 'firebase-tests/**'
      - 'package.json'
      - '.github/workflows/firebase-rules-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rules:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Instalar dependencias dos testes
        run: npm install --no-audit --no-fund --ignore-scripts
      - name: Testar permissões com Firestore Emulator
        run: npm run test:rules
