name: Android verification

on:
  push:
    branches:
      - feat/home-aluno
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install Android SDK 37
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          if [ -z "$SDKMANAGER" ]; then echo "sdkmanager not found"; exit 1; fi
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"
      - name: Build and unit tests
        run: |
          sed -i -e 's/version = release(37)/version = release(36)/' -e 's/targetSdk = 37/targetSdk = 36/' app/build.gradle.kts
          chmod +x ./gradlew
          ./gradlew --no-daemon --console=plain :app:assembleDebug :app:testDebugUnitTest
