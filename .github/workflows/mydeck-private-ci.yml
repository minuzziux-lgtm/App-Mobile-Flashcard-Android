name: MyDeck - validacao Android privada

on:
  push:
    branches:
      - dev/mydeck-private
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mydeck-private-validation
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Instalar SDK Android
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          if [ -z "$SDKMANAGER" ]; then echo 'sdkmanager ausente'; exit 1; fi
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platforms;android-37.0" "build-tools;36.0.0" --channel=3
      - name: Testes e APK debug
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon --stacktrace --console=plain :app:testDebugUnitTest :app:assembleDebug

      - name: Publicar relatorios unitarios
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mydeck-unit-tests
          path: app/build/reports/tests/
          if-no-files-found: ignore

  instrumented:
    name: Testes em emulador Android
    needs: android
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Preparar projeto Android
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platforms;android-37.0" "build-tools;36.0.0" --channel=3
          chmod +x ./gradlew
      - name: Habilitar KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Testar fluxo no emulador
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: ./gradlew --no-daemon --console=plain :app:connectedDebugAndroidTest
      - name: Publicar relatorios Android
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mydeck-android-tests
          path: |
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
          if-no-files-found: ignore
